<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>4DGS Interactive Viewer</title>
      <script type="module" crossorigin src="./assets/index-837e0773.js"></script>
      <link rel="stylesheet" href="./assets/index-b5b352af.css">
    </head>
    <body>
        <div id="viewer">
            <div id="loading-overlay">
                <div id="loading-box">
                    <p>Loading scene...</p>
                    <progress max="100" id="progress-indicator"></progress>
                </div>
            </div>
            <canvas id="canvas"></canvas>
        </div>

        <div id="scene-picker">
            <div class="scene-card active" data-index="0">
                <div class="scene-thumb thumb-cook"></div>
                <span class="scene-name">Cook</span>
            </div>
            <div class="scene-card" data-index="1">
                <div class="scene-thumb thumb-table"></div>
                <span class="scene-name">Table</span>
            </div>
            <div class="scene-card" data-index="2">
                <div class="scene-thumb thumb-horse"></div>
                <span class="scene-name">Horse</span>
            </div>
        </div>

        
    </body>
</html>
